model = "gpt-5.2"          # 实际调用的模型名称
model_reasoning_effort = "low"           # 推理强度（max/medium/min）
model_context_window = 200000            # 上下文窗口大小（token数）
model_max_output_tokens = 64000          # 最大输出长度
disable_response_storage = true          # 不存储对话记录（隐私）
sandbox_mode = "danger-full-access"      # 允许任意系统操作（谨慎使用）
personality = "pragmatic"                # 回答风格：务实

